<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Lumea — Hotel Fountain CRM</title>
  <meta name="theme-color" content="#1C1510"/>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Lumea"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
  <link rel="icon" href="/favicon.ico" sizes="any"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏨</text></svg>" type="image/svg+xml"/>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
        html,body,#root{height:100%;background:#1C1510;overflow:hidden;margin:0}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1C1510;flex-direction:column;gap:16px;z-index:9999}
    #loading h1{font-family:'Libre Baskerville',Georgia,serif;font-size:36px;color:#C8A96E;font-weight:700;letter-spacing:.02em}
    #loading h1 em{font-style:italic;font-weight:400}
    #loading p{color:rgba(200,169,110,.45);font-size:9px;letter-spacing:.22em;text-transform:uppercase;font-family:'DM Sans',system-ui,sans-serif}
    .spin{width:20px;height:20px;border:2px solid rgba(200,169,110,.2);border-top-color:#C8A96E;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="loading"><h1><em>Lumea</em></h1><div class="spin"></div><p>Hotel Fountain CRM</p></div>
  <div id="root" style="height:100%"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="/crm-config.js"></script>
  <script src="/crm-bundle.js?v=20260604215553"></script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
  <script>
    (function(){
      if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) return;
      var deferred = null;
      window.addEventListener('beforeinstallprompt', function(e){
        e.preventDefault(); deferred = e;
        var b = document.createElement('button');
        b.textContent = 'Install Lumea App';
        b.setAttribute('aria-label','Install Lumea as an app');
        b.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:99999;padding:12px 20px;background:#C8A96E;color:#1C1510;border:none;border-radius:10px;font:600 12px/1 "DM Sans",system-ui,sans-serif;letter-spacing:.04em;box-shadow:0 8px 28px rgba(0,0,0,.45);cursor:pointer;transition:transform .2s';
        b.onmouseover=function(){b.style.transform='translateY(-2px)'};
        b.onmouseout=function(){b.style.transform='none'};
        b.onclick=function(){ if(!deferred) return; deferred.prompt(); deferred.userChoice.finally(function(){ deferred=null; b.remove(); }); };
        document.body.appendChild(b);
      });
      window.addEventListener('appinstalled', function(){ deferred=null; });
    })();
  </script>
</body>
</html>
