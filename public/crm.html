<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Lumea — Hotel Fountain CRM</title>
  <meta name="theme-color" content="#1C1510"/>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Lumea"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
  <link rel="icon" href="/favicon.ico" sizes="any"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏨</text></svg>" type="image/svg+xml"/>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    html,body,#root{height:100%;height:100dvh;background:#1C1510;overflow:hidden;margin:0}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1C1510;flex-direction:column;gap:16px;z-index:9999}
    #loading h1{font-family:'Libre Baskerville',Georgia,serif;font-size:36px;color:#C8A96E;font-weight:700;letter-spacing:.02em}
    #loading h1 em{font-style:italic;font-weight:400}
    #loading p{color:rgba(200,169,110,.45);font-size:9px;letter-spacing:.22em;text-transform:uppercase;font-family:'DM Sans',system-ui,sans-serif}
    .spin{width:20px;height:20px;border:2px solid rgba(200,169,110,.2);border-top-color:#C8A96E;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes bellRing{0%,55%,100%{transform:rotate(0)}8%{transform:rotate(15deg)}16%{transform:rotate(-13deg)}24%{transform:rotate(10deg)}32%{transform:rotate(-7deg)}40%{transform:rotate(4deg)}48%{transform:rotate(-2deg)}}
    /* ── Mobile responsive shell (lives here so it is always fresh, no-cache) ── */
    .lm-scrim{display:none}
    @media(max-width:768px){
      .sidebar{position:fixed!important;top:0;left:0;bottom:0;z-index:1200!important;width:266px!important;max-width:86vw;padding-top:env(safe-area-inset-top);transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:6px 0 44px rgba(0,0,0,.6)}
      body.nav-open .sidebar{transform:translateX(0)!important}
      .lm-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1100;opacity:0;pointer-events:none;transition:opacity .28s}
      body.nav-open .lm-scrim{opacity:1;pointer-events:auto}
      .main{width:100%!important;min-width:0}
      .topbar{height:auto!important;min-height:calc(54px + env(safe-area-inset-top))!important;padding:calc(env(safe-area-inset-top) + 4px) 12px 4px 56px!important;gap:8px!important;align-items:center!important}
      .tb-title{font-size:15px!important;line-height:1.1!important}
      .tb-meta{display:none!important}
      .content{padding:14px 12px calc(14px + env(safe-area-inset-bottom))!important;overscroll-behavior-y:contain!important}
      .stats,.stats-row{grid-template-columns:repeat(2,1fr)!important;gap:8px!important}
      .grid{grid-template-columns:1fr!important;gap:14px!important}
      .rooms-grid{grid-template-columns:repeat(2,1fr)!important;gap:8px!important}
      .tbl-wrap{overflow-x:auto!important;-webkit-overflow-scrolling:touch}
      .tbl{min-width:640px}
      #lmBurger{top:calc(env(safe-area-inset-top) + 8px)!important}
      .actions{top:calc(env(safe-area-inset-top) + 12px)!important}
      .modal-bg{padding:8px!important;align-items:flex-start!important;overflow-y:auto!important;overscroll-behavior:contain!important}
      .modal-w{max-width:100%!important;width:100%!important}
      .modal{max-width:100%!important;width:calc(100% - 16px)!important;max-height:88dvh!important;margin:auto}
      .modal-body{padding:14px!important}
      .card-hd{padding:12px 14px!important}
      .sec-hdr{font-size:13px!important}
    }
  </style>
</head>
<body>
  <div id="loading"><h1><em>Lumea</em></h1><div class="spin"></div><p>Hotel Fountain CRM</p></div>
  <div id="root" style="height:100%"></div>
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/vendor/gsap.min.js"></script>
  <script src="/crm-config.js"></script>
  <script src="/vendor/supabase.js"></script>
  <script src="/crm-bundle.js?v=20260702192003"></script>
  <script src="/crm-boot.js?v=20260618"></script>
</body>
</html>
