name: E2E (Playwright)

# Manual by default. Flip on `push`/`pull_request` ONCE the three repo secrets below are
# set and E2E_BASE_URL points at a NON-PROD test deployment (never prod).
on:
  workflow_dispatch:
  # pull_request:
  #   branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Playwright is installed ad-hoc so it never has to live in package.json / the lockfile
      # (keeps `next build` and `npm ci` untouched). tsconfig already excludes tests/e2e.
      - run: npm i -D @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Run E2E
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}   # e.g. a Vercel preview / test deploy URL
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}         # POS-capable account on the TEST tenant
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test --reporter=list,html
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
