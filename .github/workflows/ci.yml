name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://mynwfkgksqqwlqowlscj.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_v2XOonwuDa2gi-Z4-o40Og_1ig4AKec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Must match the Vercel project's Node version (24.x) - CI verifying on a
          # runtime production does not use is a gap the gate cannot see. Bump both
          # together if the Vercel setting ever changes.
          node-version: 24
          cache: npm
      - run: npm install


      - name: Guard — file integrity (shared with pre-commit hook)
        # Single source of truth: the same script the local pre-commit hook runs.
        # Covers crm-src.jsx (createRoot/tail/braces), crm-bundle.js (parses), route.ts
        # EOFs, AND public/crm.html (no NUL, ends </html>) — the gap that let the
        # corrupt crm.html reach production before this was wired up.
        run: bash scripts/guard-onedrive-truncation.sh

      - name: Guard — edge mail invariants
        # H-12 ratchet. The report functions spent ~6 weeks posting to a dead Brevo
        # account while logging 'success', so the CRM health dot stayed green over
        # zero delivered mail. This fails if that pattern reappears in any form.
        run: node scripts/check-edge-mail-invariants.mjs

      - name: Guard — edge deploy manifest
        # `git push` does NOT deploy Supabase edge functions. This fails when a
        # function's source changes without supabase/functions/DEPLOYED.json being
        # updated — i.e. when someone edits one and forgets to redeploy it.
        run: node scripts/check-edge-deploy-manifest.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Next build
        run: npm run vercel-build
